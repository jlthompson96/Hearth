# Hearth is an application, not a library: dependencies live in requirements*.txt
# and this file carries tool configuration only. Nothing is pip-installed from
# the repo, so there is no build backend and no editable install to go stale.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", ".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["api", "config.py", "db", "history", "ingest", "llm.py", "scripts", "tests", "tools"]
# tests/ has no __init__.py, and a test importing a helper as `tests.fake_exports`
# otherwise meets the same file under two module names. Resolve every path from
# the repo root, which is also how pytest's `pythonpath = ["."]` sees them.
explicit_package_bases = true
exclude = "(^|/)(\\.venv|web|migrations/versions)/"

[[tool.mypy.overrides]]
module = ["searx.*", "langchain_mcp_adapters.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Flat layout: the repo root is the import root, so tests import `api`, `tools`
# and friends the same way the running app does.
pythonpath = ["."]
testpaths = ["tests"]
# `make test` is the loop you run after every edit, so it holds nothing that
# needs a model. Behavioural measurement lives in evals/ behind `make eval`;
# what stays here and is marked `model` is the connection contract itself,
# runnable on demand with `pytest -m model`.
addopts = "-q --strict-markers -m 'not model'"
markers = [
  "slow: hits a real model or container; excluded from the default run",
  "model: needs a running LM Studio endpoint; deselected by default",
]
