<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hearth — a local-first personal assistant. Everything runs on my machine.">
  <style>
    .flame { animation: lick ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes lick { 0%,100% { transform: scale(1,1) } 30% { transform: scale(.94,1.08) } 60% { transform: scale(1.05,.93) } }
    .glow { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
    .ember { animation: rise linear infinite; opacity: 0; }
    @keyframes rise { 0% { transform: translate(0,0); opacity: 0 } 10% { opacity: .9 } 100% { transform: translate(var(--dx),-230px); opacity: 0 } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .flame, .glow, .ember, .cursor { animation: none } .ember { opacity: .6 } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f7f9"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <radialGradient id="warmth" cx="0.22" cy="0.78" r="0.55"><stop offset="0" stop-color="#c2410c" stop-opacity="0.30"/><stop offset="1" stop-color="#c2410c" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool" cx="0.92" cy="0.1" r="0.45"><stop offset="0" stop-color="#4150c8" stop-opacity="0.14"/><stop offset="1" stop-color="#4150c8" stop-opacity="0"/></radialGradient>
    <linearGradient id="f1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a2b"/><stop offset="0.6" stop-color="#c2410c"/><stop offset="1" stop-color="#ffb347" stop-opacity="0.2"/></linearGradient>
    <linearGradient id="f2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#875600" stop-opacity="0.3"/></linearGradient>
    <linearGradient id="f3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff4d6"/><stop offset="1" stop-color="#875600" stop-opacity="0.4"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
    <clipPath id="firebox"><rect x="184" y="142" width="154" height="94"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#warmth)" class="glow"/>
    <rect width="1200" height="320" fill="url(#cool)"/>

    <!-- the house: roof line over the hearth -->
    <path d="M118 112 L261 30 L404 112" fill="none" stroke="#dde1e8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M118 112 L261 30 L404 112" fill="none" stroke="#c2410c" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="320" y="52" width="26" height="40" fill="#eceff4" stroke="#dde1e8" stroke-width="1.5"/>

    <!-- hearth -->
    <rect x="150" y="120" width="52" height="30" rx="6" fill="#eceff4" stroke="#dde1e8" stroke-width="1.5"/><rect x="204" y="112" width="56" height="30" rx="6" fill="#eceff4" stroke="#dde1e8" stroke-width="1.5"/><rect x="262" y="112" width="56" height="30" rx="6" fill="#eceff4" stroke="#dde1e8" stroke-width="1.5"/><rect x="320" y="120" width="52" height="30" rx="6" fill="#eceff4" stroke="#dde1e8" stroke-width="1.5"/><rect x="150" y="152" width="34" height="40" rx="6" fill="#eceff4" stroke="#dde1e8" stroke-width="1.5"/><rect x="338" y="152" width="34" height="40" rx="6" fill="#eceff4" stroke="#dde1e8" stroke-width="1.5"/><rect x="150" y="194" width="34" height="42" rx="6" fill="#eceff4" stroke="#dde1e8" stroke-width="1.5"/><rect x="338" y="194" width="34" height="42" rx="6" fill="#eceff4" stroke="#dde1e8" stroke-width="1.5"/>
    <rect x="184" y="142" width="154" height="94" fill="#07080c"/>
    <g clip-path="url(#firebox)" filter="url(#soft)">
      <path class="flame" style="animation-duration:1.7s" d="M206 236 C200 206 222 196 218 168 C236 186 246 160 244 140 C266 166 270 190 262 204 C276 196 282 182 280 170 C300 196 306 220 298 236 Z" fill="url(#f1)"/>
      <path class="flame" style="animation-duration:1.3s;animation-delay:-.4s" d="M226 236 C222 214 238 206 236 186 C250 200 258 184 258 170 C274 192 276 214 268 236 Z" fill="url(#f2)"/>
      <path class="flame" style="animation-duration:1.1s;animation-delay:-.2s" d="M240 236 C238 222 248 214 248 202 C258 212 262 224 258 236 Z" fill="url(#f3)"/>
    </g>
    <rect x="196" y="230" width="58" height="9" rx="4.5" fill="#5a3a22" transform="rotate(-6 225 234)"/>
    <rect x="262" y="230" width="62" height="9" rx="4.5" fill="#4a2f1c" transform="rotate(7 293 234)"/>
    <rect x="132" y="236" width="258" height="14" rx="4" fill="#eceff4" stroke="#dde1e8" stroke-width="1.5"/>
    <circle cx="221.2" cy="236" r="1.6" fill="#c2410c" class="ember" style="--dx:26px;animation-duration:5.1s;animation-delay:-0.4s"/><circle cx="230.5" cy="236" r="1.2" fill="#ffb347" class="ember" style="--dx:-33px;animation-duration:7.1s;animation-delay:-1.6s"/><circle cx="165.4" cy="236" r="1.2" fill="#c2410c" class="ember" style="--dx:5px;animation-duration:5.7s;animation-delay:-0.4s"/><circle cx="288.7" cy="236" r="1.2" fill="#c2410c" class="ember" style="--dx:38px;animation-duration:5.8s;animation-delay:-3.0s"/><circle cx="272.5" cy="236" r="1.6" fill="#ffb347" class="ember" style="--dx:-31px;animation-duration:4.7s;animation-delay:-1.1s"/><circle cx="273.3" cy="236" r="1.6" fill="#c2410c" class="ember" style="--dx:-25px;animation-duration:3.9s;animation-delay:-4.3s"/><circle cx="270.5" cy="236" r="1.2" fill="#875600" class="ember" style="--dx:-0px;animation-duration:5.8s;animation-delay:-4.6s"/><circle cx="244.1" cy="236" r="2.0" fill="#c2410c" class="ember" style="--dx:-11px;animation-duration:5.4s;animation-delay:-6.9s"/><circle cx="324.8" cy="236" r="1.6" fill="#ffb347" class="ember" style="--dx:-0px;animation-duration:3.8s;animation-delay:-2.3s"/><circle cx="310.5" cy="236" r="2.0" fill="#c2410c" class="ember" style="--dx:1px;animation-duration:5.9s;animation-delay:-0.5s"/><circle cx="316.6" cy="236" r="1.6" fill="#c2410c" class="ember" style="--dx:37px;animation-duration:7.2s;animation-delay:-3.2s"/><circle cx="318.2" cy="236" r="2.0" fill="#ffb347" class="ember" style="--dx:-0px;animation-duration:4.9s;animation-delay:-2.6s"/><circle cx="165.1" cy="236" r="1.2" fill="#c2410c" class="ember" style="--dx:13px;animation-duration:7.3s;animation-delay:-3.6s"/><circle cx="310.9" cy="236" r="2.0" fill="#ffb347" class="ember" style="--dx:26px;animation-duration:6.1s;animation-delay:-7.4s"/><circle cx="307.7" cy="236" r="2.0" fill="#c2410c" class="ember" style="--dx:-27px;animation-duration:3.6s;animation-delay:-3.5s"/><circle cx="258.6" cy="236" r="1.6" fill="#ffb347" class="ember" style="--dx:-20px;animation-duration:6.6s;animation-delay:-1.0s"/><circle cx="351.7" cy="236" r="2.4" fill="#c2410c" class="ember" style="--dx:4px;animation-duration:3.8s;animation-delay:-3.4s"/><circle cx="330.2" cy="236" r="2.0" fill="#ffb347" class="ember" style="--dx:15px;animation-duration:6.3s;animation-delay:-7.4s"/><circle cx="360.7" cy="236" r="1.6" fill="#c2410c" class="ember" style="--dx:13px;animation-duration:3.8s;animation-delay:-1.1s"/><circle cx="256.7" cy="236" r="1.6" fill="#ffb347" class="ember" style="--dx:-6px;animation-duration:4.6s;animation-delay:-0.0s"/><circle cx="284.2" cy="236" r="2.0" fill="#875600" class="ember" style="--dx:1px;animation-duration:7.3s;animation-delay:-5.2s"/><circle cx="294.1" cy="236" r="1.2" fill="#875600" class="ember" style="--dx:36px;animation-duration:5.3s;animation-delay:-6.5s"/><circle cx="325.5" cy="236" r="2.4" fill="#ffb347" class="ember" style="--dx:-1px;animation-duration:5.1s;animation-delay:-3.0s"/><circle cx="163.7" cy="236" r="1.2" fill="#875600" class="ember" style="--dx:-31px;animation-duration:7.4s;animation-delay:-3.3s"/><circle cx="161.6" cy="236" r="1.2" fill="#875600" class="ember" style="--dx:36px;animation-duration:5.8s;animation-delay:-4.0s"/><circle cx="155.6" cy="236" r="1.6" fill="#ffb347" class="ember" style="--dx:-20px;animation-duration:6.0s;animation-delay:-1.1s"/><circle cx="282.5" cy="236" r="2.4" fill="#ffb347" class="ember" style="--dx:39px;animation-duration:4.0s;animation-delay:-6.4s"/><circle cx="255.7" cy="236" r="2.0" fill="#ffb347" class="ember" style="--dx:-13px;animation-duration:3.8s;animation-delay:-0.8s"/><circle cx="255.3" cy="236" r="1.6" fill="#ffb347" class="ember" style="--dx:36px;animation-duration:5.6s;animation-delay:-1.5s"/><circle cx="182.3" cy="236" r="1.2" fill="#c2410c" class="ember" style="--dx:11px;animation-duration:6.5s;animation-delay:-2.2s"/><circle cx="303.2" cy="236" r="2.0" fill="#c2410c" class="ember" style="--dx:-12px;animation-duration:5.6s;animation-delay:-6.8s"/><circle cx="267.2" cy="236" r="2.0" fill="#c2410c" class="ember" style="--dx:23px;animation-duration:6.0s;animation-delay:-4.6s"/><circle cx="327.3" cy="236" r="2.4" fill="#ffb347" class="ember" style="--dx:1px;animation-duration:6.5s;animation-delay:-1.7s"/><circle cx="310.8" cy="236" r="1.2" fill="#875600" class="ember" style="--dx:-25px;animation-duration:6.7s;animation-delay:-3.5s"/>

    <!-- words -->
    <text x="468" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="10" fill="#12151c">HEARTH</text>
    <rect x="472" y="146" width="96" height="3" rx="1.5" fill="#c2410c"/>
    <text x="470" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#596275">A local-first personal assistant over my own data.</text>
    <text x="470" y="206" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" font-size="13" fill="#596275" fill-opacity="0.8">everything runs on my machine<tspan class="cursor" fill="#c2410c">▍</tspan></text>
    <rect x="470" y="224" width="92" height="26" rx="5" fill="#c2410c" fill-opacity="0.1" stroke="#c2410c" stroke-opacity="0.55"/><text x="516.0" y="241.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#c2410c">STEWARD</text><rect x="572" y="224" width="72" height="26" rx="5" fill="#1d7a3f" fill-opacity="0.1" stroke="#1d7a3f" stroke-opacity="0.55"/><text x="608.0" y="241.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#1d7a3f">TALLY</text><rect x="654" y="224" width="72" height="26" rx="5" fill="#4150c8" fill-opacity="0.1" stroke="#4150c8" stroke-opacity="0.55"/><text x="690.0" y="241.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#4150c8">FORGE</text><rect x="736" y="224" width="82" height="26" rx="5" fill="#875600" fill-opacity="0.1" stroke="#875600" stroke-opacity="0.55"/><text x="777.0" y="241.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#875600">ERRAND</text>
    <text x="470" y="282" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" font-size="12" fill="#596275" fill-opacity="0.7">8 GB VRAM · 8,192-token window · no telemetry · no live financial connections</text>
