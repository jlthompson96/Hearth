# Infrastructure only. The backend and the frontend run on the host, not in
# containers, because the backend must reach LM Studio on the host's localhost.
#
# Every port is bound to 127.0.0.1. Nothing here is reachable from the network.

name: hearth

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume only. Anything that must survive a
      # re-seed belongs in an Alembic migration instead.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  searxng:
    # Pinned by tag and digest, as `latest` named it on 2026-10-07; bump both
    # together, deliberately, when Phase 9 runs it.
    image: searxng/searxng:2026.10.7-6671d89be@sha256:cc026dbee25b864d7f9731957cd5ef36ba2e2d61abd2996d57f1b863483e7409
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8080}/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    volumes:
      # Writable on purpose: the image's entrypoint substitutes the secret key
      # into settings.yml at startup, which a read-only mount would break.
      - ./docker/searxng:/etc/searxng:rw
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    restart: unless-stopped

# When ingestion is containerised, $HEARTH_DATA_DIR mounts here read-only:
#   - ${HEARTH_DATA_DIR}:/data:ro
# It is not mounted today because nothing in a container reads CSVs yet.

volumes:
  pgdata:
