# Lint and tests on every pull request to main, and on main itself.
#
# What it sees: the repository and the invented golden fixture, in a throwaway
# Postgres. Never .env, never real data, never a model — `make test` holds
# nothing that needs one. CLAUDE.md's rules 5 and 6 govern the running app;
# this is the development loop, run somewhere a merge cannot skip it.
#
# HEARTH_REQUIRE_DB turns the test harness's "Postgres unreachable" skip into a
# failure: here a missing database is a broken setup, and a run that skipped
# every database test would be green having proved nothing.
#
# Actions are pinned to the commit their tag named on 2026-10-07.

name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hearth
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: hearth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hearth -d hearth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://hearth:ci-only@localhost:5432/hearth
      DATABASE_URL_RO: postgresql+psycopg://hearth_ro:ci-only@localhost:5432/hearth
      # Never called: tests that need a model are marked `model` and deselected.
      # Set because the settings refuse to load without a name.
      CHAT_MODEL: ci-no-model
      EMBEDDING_MODEL: ci-no-model
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      HEARTH_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # tests/test_restore.py dumps and restores with the real programs, and
      # they must match the server's major version. The runner's own client is
      # older, so 17 comes from PostgreSQL's apt repository; PGBIN points the
      # scripts at it.
      - name: PostgreSQL 17 client, for the dump-and-restore round trip
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-17
          echo "PGBIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - name: Lint — ruff, mypy, tsc
        run: make PYTHON=python lint

      - name: Test
        run: make PYTHON=python test
